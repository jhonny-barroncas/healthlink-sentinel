services:
  healthlink:
    # O HealthLink termina o HTTPS diretamente na porta pública 3002.
    # Necessário para ler a chave privada do certificado montado pelo host.
    user: root
    ports: !override
      - "3002:3002"
    environment:
      HTTPS: "true"
      HTTPS_KEY_PATH: /etc/letsencrypt/live/aplicacao.gbringel.com/privkey.pem
      HTTPS_CERT_PATH: /etc/letsencrypt/live/aplicacao.gbringel.com/fullchain.pem
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "node", "-e", "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0'; fetch('https://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
