services:
  healthlink:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://healthlink:${POSTGRES_PASSWORD:-healthlink_change_me}@postgres:5432/healthlink
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3002"
    volumes:
      - ./.certs:/app/.certs:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const secure = process.env.HTTPS === 'true'; const client = secure ? require('https') : require('http'); const request = client.get((secure ? 'https' : 'http') + '://127.0.0.1:3002/health', secure ? { rejectUnauthorized: false } : {}, response => process.exit(response.statusCode === 200 ? 0 : 1)); request.on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 5

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://healthlink:${POSTGRES_PASSWORD:-healthlink_change_me}@postgres:5432/healthlink
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "bootstrap:sysadmin"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthlink
      POSTGRES_USER: healthlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthlink_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthlink -d healthlink"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-healthlink_change_me}
    volumes:
      - ./apps/api/database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["psql -h postgres -U healthlink -d healthlink -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())'; for file in /migrations/*.sql; do version=$$(basename $$file); applied=$$(psql -h postgres -U healthlink -d healthlink -tAc \"SELECT 1 FROM schema_migrations WHERE version = '$$version'\"); if [ \"$$applied\" != \"1\" ]; then echo Applying $$version; psql -h postgres -U healthlink -d healthlink -v ON_ERROR_STOP=1 -f $$file || exit 1; psql -h postgres -U healthlink -d healthlink -v ON_ERROR_STOP=1 -c \"INSERT INTO schema_migrations(version) VALUES ('$$version')\" || exit 1; fi; done"]
    restart: "no"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  retention:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-healthlink_change_me}
      HEALTHLINK_RETENTION_INTERVAL_SECONDS: ${HEALTHLINK_RETENTION_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/postgres-retention.sql:/retention.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[retention] executando limpeza do PostgreSQL";
          psql -h postgres -U healthlink -d healthlink -v ON_ERROR_STOP=1 -f /retention.sql || exit 1;
          sleep "$${HEALTHLINK_RETENTION_INTERVAL_SECONDS:-86400}";
        done
    restart: unless-stopped

volumes:
  postgres_data:
